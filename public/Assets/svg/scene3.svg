<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"><style>
.fl{transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:.95}100%{transform:translate(var(--dx,20px),420px) rotate(360deg);opacity:.9}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-150px) scale(1.2);opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.bob{animation:bob 3.2s ease-in-out infinite}
.bob2{animation:bob 3.2s ease-in-out -1.6s infinite}
.blink{animation:blink 4.5s infinite}
.sway{animation:sway 4s ease-in-out infinite;transform-origin:50% 0}
.tw{animation:tw 2.4s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
.flick{animation:flick .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
.beat{animation:beat 1.8s ease-in-out infinite}
.rise{animation:rise 5s ease-in infinite}
.fall{animation:fall 9s linear infinite}
